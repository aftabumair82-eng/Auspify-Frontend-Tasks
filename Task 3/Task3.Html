<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 3rem auto; padding: 1rem; }
    .input-group { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; background: #28a745; color: white; border: none; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 1rem; }
    li { display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .del-btn { background: #dc3545; padding: 0.2rem 0.5rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h2>My To-Do List</h2>
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="taskList"></ul>

  <script>
    document.addEventListener("DOMContentLoaded", loadTasks);
    function loadTasks() {
      const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      tasks.forEach((task, i) => {
        list.innerHTML += `<li>${task} <button class="del-btn" onclick="removeTask(${i})">Delete</button></li>`;
      });
    }
    function addTask() {
      const input = document.getElementById("taskInput");
      if (!input.value) return;
      const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
      tasks.push(input.value);
      localStorage.setItem("tasks", JSON.stringify(tasks));
      input.value = "";
      loadTasks();
    }
    function removeTask(index) {
      const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
      tasks.splice(index, 1);
      localStorage.setItem("tasks", JSON.stringify(tasks));
      loadTasks();
    }
  </script>
</body>
</html>
