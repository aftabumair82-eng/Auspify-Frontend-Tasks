<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auspify Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { line-height: 1.6; color: #333; background-color: #f8f9fa; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #0052cc; color: white; }
    header .logo { font-size: 1.5rem; font-weight: bold; }
    header nav a { color: white; margin-left: 1rem; text-decoration: none; font-weight: 500; }
    header nav a:hover { text-decoration: underline; }
    .hero { text-align: center; padding: 6rem 1rem; background: #ffffff; margin-bottom: 2rem; border-bottom: 1px solid #e9ecef; }
    .hero h1 { font-size: 2.8rem; margin-bottom: 1rem; color: #0052cc; }
    .hero p { font-size: 1.2rem; color: #6c757d; max-width: 600px; margin: 0 auto; }
    .btn { display: inline-block; padding: 0.8rem 1.8rem; background: #0052cc; color: white; text-decoration: none; border-radius: 5px; margin-top: 1.5rem; font-weight: bold; }
    .btn:hover { background: #003d99; }
    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; }
      header nav { margin-top: 0.8rem; }
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Auspify Tech</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Bring Future Through Tech</h1>
    <p>Build industry-ready skills with practical projects and hands-on training.</p>
    <a href="#contact" class="btn">Get Started</a>
  </section>
</body>
</html>
