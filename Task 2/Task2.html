<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 2rem; max-width: 800px; margin: auto; background: #f4f6f9; color: #333; }
    section { margin-bottom: 2rem; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { color: #0052cc; font-size: 2.2rem; margin-bottom: 0.5rem; }
    h2 { color: #0052cc; font-size: 1.5rem; margin-bottom: 1rem; border-bottom: 2px solid #0052cc; display: inline-block; padding-bottom: 0.2rem; }
    p { color: #555; line-height: 1.6; }
    ul { list-style: none; padding: 0; }
    li { background: #eef2f5; margin: 0.5rem 0; padding: 0.8rem; border-radius: 5px; font-weight: 500; transition: transform 0.2s, background 0.2s; }
    li:hover { transform: translateX(8px); background: #0052cc; color: white; }
    form input, form textarea { display: block; width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
    button { background: #0052cc; color: white; border: none; padding: 0.8rem 1.5rem; cursor: pointer; border-radius: 5px; font-size: 1rem; font-weight: bold; }
    button:hover { background: #003d99; }
  </style>
</head>
<body>
  <section class="about">
    <h1>Hi, I'm Frontend Developer</h1>
    <p>Welcome to my portfolio! I build clean, responsive, and user-friendly web interfaces using modern frontend web technologies.</p>
  </section>

  <section class="skills">
    <h2>My Skills</h2>
    <ul>
      <li>HTML5 & Responsive Layouts</li>
      <li>CSS3 Styling & Animations</li>
      <li>JavaScript & Web APIs</li>
    </ul>
  </section>

  <section class="contact">
    <h2>Contact Me</h2>
    <form onsubmit="alert('Thank you! Your message has been sent.'); return false;">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>
</body>
</html>
