<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 3rem; background: #eef2f5; }
    .card { background: white; padding: 2rem; max-width: 350px; margin: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input, button { padding: 0.5rem; margin-top: 0.5rem; }
    button { background: #0052cc; color: white; border: none; cursor: pointer; }
    #result { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Weather App</h2>
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Search</button>
    <div id="result"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById('cityInput').value;
      const resultDiv = document.getElementById('result');
      if(!city) { resultDiv.innerHTML = "Please enter a city"; return; }
      
      try {
        // Open-Meteo free API use ki gayi hai (No API key required)
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
        const geoData = await geoRes.json();
        
        if(!geoData.results) { resultDiv.innerHTML = "City not found!"; return; }
        
        const { latitude, longitude, name, country } = geoData.results[0];
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        const weatherData = await weatherRes.json();
        
        const temp = weatherData.current_weather.temperature;
        resultDiv.innerHTML = `<h3>${name}, ${country}</h3><p>Temperature: <strong>${temp} °C</strong></p>`;
      } catch (err) {
        resultDiv.innerHTML = "Error fetching data!";
      }
    }
  </script>
</body>
</html>
